#  CI/CD 自动部署到 Ubuntu 服务器
name: 自动部署到 Ubuntu

# 触发条件：代码 push 到 main 分支就自动部署
on:
  push:
    branches: [ main ]

# 部署任务
jobs:
  deploy:
    runs-on: ubuntu-latest  # GitHub 运行环境
    
    steps:
      # 1. 拉取 GitHub 代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2. 安装 Node.js 环境（根据你的项目替换）
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装项目依赖
      - name: 安装依赖
        run: npm install

      # 4. 通过 SSH 连接服务器并部署（核心步骤）
      - name: 部署到 Ubuntu 服务器
        uses: appleboy/ssh-action@master
        with:
          # 以下配置必须在 GitHub 仓库 Secrets 中配置
          host: ${{ secrets.SERVER_HOST }}       # 服务器IP
          username: ${{ secrets.SERVER_USER }}   # 服务器用户名（默认 ubuntu/root）
          key: ${{ secrets.SERVER_SSH_KEY }}     # 服务器私钥
          port: ${{ secrets.SERVER_PORT }}       # SSH端口，默认22
          
          # 服务器上执行的部署脚本
          script: |
            cd /home/ubuntu/apps/cicd-demo       # 服务器项目目录（自己创建）
            git pull origin main                 # 拉取最新代码
            npm install                          # 安装依赖
            pm2 restart cicd-demo || pm2 start app.js --name cicd-demo  # 重启/启动项目